<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <title>Registration Form</title>
</head>
<body>
   <nav>
  <a href="index.html">Login</a> |
  <a href="register.html">Register</a> |
  <a href="feedback.html">Feedback</a>
</nav>
 <h2>Student Registration Form</h2>
 <form action="#" method="post">
 <label>Full Name:</label><br>
 <input type="text" name="name" required>
 <br><br>
 <label>Email:</label><br>
 <input type="email" name="email" required>
 <br><br>
 <label>Password:</label><br>
 <input type="password" name="pwd" required>
 <br><br>
 <label>Gender:</label>
 <input type="radio"
 name="gender"
 value="M">
 Male
 <input type="radio"
 name="gender"
 value="F">
 Female
 <input type="radio"
 name="gender"
 value="O">
 Other
 <br><br>
 <label>Courses:</label>
 <input type="checkbox"
 name="course"
 value="Python">
 Python
 <input type="checkbox"
 name="course"
 value="COAS">
 COAS
 <input type="checkbox"
    name="course"
    value="java">
 Java
 <br><br>
 <label>Date of Birth:</label>
 <input type="date"
 name="dob">
 <br><br>
 <label>Country:</label>
 <select name="country">
 <option>India</option>
 <option>USA</option>
 <option>UK</option>
 <option>others</option>
 </select>
 <br><br>
 <input type="submit"
 value="Register">
 <input type="reset"
 value="Reset">
 </form>
</body>
</html>
